seed: 42

paths:
  data_dir: data
  dataset_dir: data/nfcorpus          
  artifacts_dir: artifacts
  results_dir: results
  figures_dir: report/figures

dataset:
  url: https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/nfcorpus.zip
  expected_docs: 3633
  expected_queries: 3237
  expected_test_queries: 323
  doc_representation: "title + ' ' + text"

preprocessing:
  lowercase: true
  remove_stopwords: true
  stopwords_lang: english
  stopwords_keep: [d]
  stemmer: porter                      
  keep_numbers: true                 

bm25:
  k1: 1.2
  b: 0.75
  top_k: 100

spelling:
  kgram_k: 2                         
  jaccard_threshold: 0.4             
  n_typo_queries: 10

semantic:
  candidates:
    - sentence-transformers/all-MiniLM-L6-v2
    - sentence-transformers/multi-qa-MiniLM-L6-cos-v1
  model: null                        
  batch_size: 32
  normalize: true                    
  device: cpu
  top_k: 100

hybrid:
  k_candidates: [10, 20, 40, 60, 80, 100]
  k: null                            
  depth: 100                         
  top_k: 100

rerank:
  model: cross-encoder/ms-marco-MiniLM-L6-v2
  rerank_depth: 50                   
  batch_size: 32
  device: cpu

rag:
  rag_query_ids: [PLAIN-68, PLAIN-2450, PLAIN-153, PLAIN-2850, PLAIN-2750,
                  PLAIN-270, PLAIN-2470, PLAIN-2430, PLAIN-238, PLAIN-3342]
  n_eligible_expected: 42
  context_k: 5
  language: en
  backend: null                     
  model: null
  temperature: 0
  max_tokens: 512
  llm_seed: 42
  cache_file: artifacts/llm_cache.jsonl

eval:
  cutoffs: [5, 10]
